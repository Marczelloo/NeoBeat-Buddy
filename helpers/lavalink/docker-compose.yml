services:
  yt-cipher:
    image: ghcr.io/kikkia/yt-cipher:master
    environment:
      API_TOKEN: ${YT_CIPHER_API_TOKEN:-}
      OVERRIDE_PLAYER_VARIANT: IAS
    restart: unless-stopped

  lavalink:
    image: ghcr.io/lavalink-devs/lavalink:4
    container_name: lavalink
    env_file:
      - ../../.env.dev
    environment:
      - SERVER_PORT=2333
      - LAVALINK_SERVER_PASSWORD=${LAVALINK_PASSWORD:-youshallnotpass}
      - YT_CIPHER_API_TOKEN=${YT_CIPHER_API_TOKEN:-}
    volumes:
      - ./application.yml:/opt/Lavalink/application.yml:ro
      - ./plugins:/opt/Lavalink/plugins
      - ./youtube-cookies.txt:/opt/Lavalink/youtube-cookies.txt:ro
    ports:
      - "2333:2333"
    restart: unless-stopped
    depends_on:
      yt-cipher:
        condition: service_started
